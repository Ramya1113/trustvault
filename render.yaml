services:
  - type: web
    name: trustvault
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn run:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString

databases:
  - name: trustvault-db
    databaseName: trustvault
    user: trustvault
    plan: free
