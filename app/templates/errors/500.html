{% extends "base.html" %}

{% block title %}Internal Server Error - TrustVault{% endblock %}

{% block content %}
<div class="card" style="text-align: center; max-width: 600px; margin: 3rem auto; padding: 2.5rem;">
    <h1 style="font-size: 2.5rem; color: var(--danger-text); margin-bottom: 1rem;">500</h1>
    <h2 style="font-size: 1.5rem; margin-bottom: 1rem;">Internal Server Error</h2>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">
        An unexpected error occurred while processing your request. Our system administrators have been notified.
    </p>
    <div>
        <a href="{{ url_for('auth.dashboard') }}" style="display: inline-block; background-color: var(--primary); color: white; padding: 0.6rem 1.2rem; border-radius: 4px; text-decoration: none; font-weight: 500;">
            Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
